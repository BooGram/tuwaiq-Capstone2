spring.application.name=maqas

spring.datasource.url=jdbc:mysql://localhost:3306/maqas
spring.datasource.username=root
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

notification.email.enabled=true
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

notification.whatsapp.enabled=true
ultramsg.instance-id=${ULTRAMSG_INSTANCE_ID:}
ultramsg.token=${ULTRAMSG_TOKEN:}

openai.chatgpt.enabled=true
openai.api-key=${OPENAI_API_KEY:}
openai.model=gpt-4.1-mini
